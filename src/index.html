  LLIMEdit — single-window editor shell.
  Layout: header (menu + settings), split content (chat | editor), status bar.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLIMEdit - Untitled</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <nav id="menu-bar" aria-label="Application menu"></nav>
      <button
        id="settings-button"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        <svg
          class="settings-icon"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Zm9.2 4.8a7.4 7.4 0 0 0-.12-1.6l2.02-1.58a.6.6 0 0 0 .14-.77l-1.92-3.32a.6.6 0 0 0-.72-.27l-2.38.96a7.5 7.5 0 0 0-2.76-1.6l-.36-2.54A.6.6 0 0 0 14.4 2h-3.8a.6.6 0 0 0-.59.5l-.36 2.54a7.5 7.5 0 0 0-2.76 1.6l-2.38-.96a.6.6 0 0 0-.72.27L2.06 9.27a.6.6 0 0 0 .14.77l2.02 1.58c-.08.52-.12 1.04-.12 1.6s.04 1.08.12 1.6l-2.02 1.58a.6.6 0 0 0-.14.77l1.92 3.32a.6.6 0 0 0 .72.27l2.38-.96c.86.68 1.8 1.22 2.76 1.6l.36 2.54a.6.6 0 0 0 .59.5h3.8a.6.6 0 0 0 .59-.5l.36-2.54a7.5 7.5 0 0 0 2.76-1.6l2.38.96a.6.6 0 0 0 .72-.27l1.92-3.32a.6.6 0 0 0-.14-.77l-2.02-1.58c.08-.52.12-1.04.12-1.6Z"
          />
        </svg>
      </button>
    </header>

    <div id="content-split">
      <aside id="chat-panel" aria-label="AI Chat">
        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
        <div class="chat-input-area">
          <div class="chat-input-frame">
            <textarea
              id="chat-input"
              rows="3"
              placeholder="Ask the model to edit your document..."
              spellcheck="false"
            ></textarea>
            <div class="chat-send-bar">
              <select id="chat-model-picker" class="chat-model-picker" aria-label="Model">
                <option value="">(no model)</option>
              </select>
              <div id="chat-capability-icons" class="chat-capability-icons" aria-label="Model capabilities">
                <span
                  id="chat-cap-vision"
                  class="chat-cap-icon"
                  data-capability="vision"
                  data-state="unsupported"
                  role="img"
                  aria-label="Vision capability"
                  title="Vision: not supported"
                >
                  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                  </svg>
                </span>
                <span
                  id="chat-cap-tools"
                  class="chat-cap-icon"
                  data-capability="tools"
                  data-state="unsupported"
                  role="img"
                  aria-label="Tool use capability"
                  title="Tool use: not supported"
                >
                  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6 2 2 6-6a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.4-2.4 2.4-2.4Z" />
                  </svg>
                </span>
                <button
                  id="chat-cap-reasoning"
                  type="button"
                  class="chat-cap-icon chat-cap-reasoning"
                  data-capability="reasoning"
                  data-state="unsupported"
                  aria-label="Reasoning: not supported"
                  aria-pressed="false"
                  title="Reasoning: not supported"
                  disabled
                >
                  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3 1.5 8.5 12 14l10.5-5.5L12 3Z" />
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 11v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4" />
                  </svg>
                </button>
              </div>
              <button id="chat-send" type="button">Send</button>
            </div>
          </div>
          <div class="chat-control-bar">
            <button id="chat-clear" type="button">Clear</button>
            <span id="chat-token-count" class="chat-token-count">0 Tokens</span>
          </div>
        </div>
      </aside>

      <div id="inference-divider" class="split-divider" aria-hidden="true"></div>

      <aside id="inference-panel" aria-label="Inference settings"></aside>

      <div id="split-divider" class="split-divider" aria-hidden="true"></div>

      <main id="document-editor">
        <!-- Document buffer pane (top, flex-resizable) -->
        <div id="doc-buffer-pane">
          <div id="column-ruler" class="column-ruler" aria-hidden="true">
            <span class="column-ruler-labels"></span>
          </div>
          <div id="editor-body" class="editor-body">
            <div id="line-gutter" class="line-gutter" aria-hidden="true"></div>
            <div class="editor-buffer-wrap">
              <div id="selection-overlay" class="selection-overlay" aria-hidden="true"></div>
              <textarea
                id="buffer"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                wrap="soft"
                autofocus
              ></textarea>
              <div id="buffer-mirror" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <!-- Horizontal resize handle -->
        <div id="tool-pane-divider" class="split-divider-h" aria-hidden="true"></div>

        <!-- Tool editor pane (bottom) — file bar + JS impl | JSON schema -->
        <div id="tool-editor-pane">
          <div id="tool-file-bar" class="tool-file-bar">
            <label class="tool-file-name-row" for="tool-file-name">
              <span class="tool-file-label">Tool file:</span>
              <input
                id="tool-file-name"
                class="tool-file-name"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="Untitled.lmtool"
              />
            </label>
            <div class="tool-file-controls">
              <button id="tool-load" type="button" class="tool-file-btn tool-file-btn-primary">Load</button>
              <button id="tool-save" type="button" class="tool-file-btn tool-file-btn-primary">Save</button>
              <button id="tool-save-as" type="button" class="tool-file-btn tool-file-btn-primary">Save as…</button>
              <button id="tool-delete" type="button" class="tool-file-btn tool-file-btn-danger" disabled>Delete</button>
            </div>
          </div>

          <div id="tool-split-row" class="tool-split-row">
            <div id="tool-impl-pane" class="tool-sub-pane">
            <div class="tool-pane-header">
              <span class="tool-pane-label">Implementation (JS)</span>
            </div>
            <textarea
              id="tool-impl-editor"
              class="tool-code-editor"
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              placeholder="// async function run(args, ctx) {&#10;//   return { ok: true, result: args.input };&#10;// }"
            ></textarea>
          </div>

          <!-- Vertical resize handle between the two tool sub-panes -->
          <div id="tool-schema-divider" class="split-divider" aria-hidden="true" style="cursor:col-resize;"></div>

          <!-- Right: JSON schema editor -->
          <div id="tool-schema-pane" class="tool-sub-pane">
            <div class="tool-pane-header">
              <span class="tool-pane-label">Schema (JSON)</span>
              <span id="tool-schema-status" class="tool-schema-status" data-state="idle"></span>
            </div>
            <textarea
              id="tool-schema-editor"
              class="tool-code-editor"
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              placeholder='{&#10;  "type": "function",&#10;  "function": {&#10;    "name": "my_tool",&#10;    "description": "What this tool does.",&#10;    "parameters": {&#10;      "type": "object",&#10;      "properties": {&#10;        "input": { "type": "string" }&#10;      },&#10;      "required": ["input"]&#10;    }&#10;  }&#10;}'
            ></textarea>
          </div>
          </div>
        </div>
      </main>
    </div>

    <footer id="status-bar" role="status" aria-live="polite">
      <span id="status-path" class="status-segment"></span>
      <span id="status-cursor" class="status-segment"></span>
      <span id="status-model" class="status-segment status-model"></span>
    </footer>

    <script type="module" src="api.js"></script>
    <script type="module" src="editor.js"></script>
    <script type="module" src="editor_chrome.js"></script>
    <script type="module" src="chat.js"></script>
    <script type="module" src="inference_panel.js"></script>
    <script type="module" src="status_bar.js"></script>
    <script type="module" src="settings_modal.js"></script>
    <script type="module" src="menu.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
