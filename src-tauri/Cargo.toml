[package]
name = "llm_editor"
version = "0.1.0"
edition = "2024"

[features]
default = []
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [], optional = true }

[profile.dev]
incremental = true
